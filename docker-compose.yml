services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      LEDGER_DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      LEDGER_HTTP_ADDR: :8080
      LEDGER_JWT_SECRET: dev-only-change-me-use-32chars-min!!
      LEDGER_ALLOW_REGISTER: "true"
      LEDGER_SEED: "true"
      LEDGER_SEED_EMAIL: operator@ledger.local
      LEDGER_SEED_PASSWORD: change-me-now-12

volumes:
  pgdata:
