{{define "move"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger · move</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><strong>Ledger</strong><span>{{.Email}}</span></div>
    <nav>
      <a href="/">Books</a>
      <a href="/move">Move</a>
      <a href="/journals">Journals</a>
      <form method="post" action="/logout"><button class="btn secondary" type="submit">Sign out</button></form>
    </nav>
  </header>
  <h1>Post a transfer</h1>
  <p class="lead">Recipes compile to one debit and one credit. Amount is integer kobo.</p>
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
  {{if .OK}}<div class="flash ok">{{.OK}}</div>{{end}}
  <div class="card">
    <form method="post" action="/move">
      <label for="recipe">Recipe</label>
      <select id="recipe" name="recipe">
        <option value="p2p">P2P · debit Alice wallet, credit Bob wallet</option>
        <option value="deposit">Deposit · debit Cash, credit Alice wallet</option>
        <option value="withdraw">Withdraw · debit Alice wallet, credit Cash</option>
        <option value="fee">Fee · debit Alice wallet, credit Fee income</option>
        <option value="expense">Pay expense · debit Operating expense, credit Cash</option>
        <option value="custom">Custom debit / credit accounts</option>
      </select>
      <div class="row">
        <div>
          <label for="debit">Debit account (custom)</label>
          <select id="debit" name="debit">
            {{range .Accounts}}<option value="{{.ID}}">{{.Code}} {{.Name}}</option>{{end}}
          </select>
        </div>
        <div>
          <label for="credit">Credit account (custom)</label>
          <select id="credit" name="credit">
            {{range .Accounts}}<option value="{{.ID}}">{{.Code}} {{.Name}}</option>{{end}}
          </select>
        </div>
      </div>
      <label for="amount">Amount (kobo)</label>
      <input id="amount" name="amount" type="text" inputmode="numeric" pattern="[0-9]+" required placeholder="5000">
      <label for="description">Description</label>
      <input id="description" name="description" type="text" placeholder="optional">
      <button class="btn" type="submit">Post</button>
    </form>
  </div>
</div>
</body>
</html>
{{end}}
